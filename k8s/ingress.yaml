apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cat-blog-api-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"  # Allow CORS from S3/CloudFront
spec:
  rules:
  - host: api.cat-blog.local  # Change to your API domain/subdomain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cat-blog-api-service
            port:
              number: 80

