apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-blog-api
  labels:
    app: cat-blog-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cat-blog-api
  template:
    metadata:
      labels:
        app: cat-blog-api
        tier: backend
    spec:
      containers:
      - name: api
        image: cat-blog-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cat-blog-api-service
  labels:
    app: cat-blog-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: cat-blog-api

